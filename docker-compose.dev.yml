services:
  postgres:
    image: postgres:16-alpine
    container_name: zero1-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: zero1_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zero1_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: zero1-dev-valkey
    restart: unless-stopped
    command: valkey-server --save "" --appendonly no
    ports:
      - "6379:6379"
    volumes:
      - valkey_dev_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  judge0-server:
    image: judge0/judge0:1.13.1
    container_name: zero1-dev-judge0-server
    restart: unless-stopped
    ports:
      - "2358:2358"
    privileged: true
    environment:
      REDIS_HOST: valkey
      REDIS_PORT: 6379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: judge0
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  judge0-workers:
    image: judge0/judge0:1.13.1
    container_name: zero1-dev-judge0-workers
    restart: unless-stopped
    command: ["./scripts/workers"]
    privileged: true
    environment:
      REDIS_HOST: valkey
      REDIS_PORT: 6379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: judge0
    depends_on:
      judge0-server:
        condition: service_started

volumes:
  postgres_dev_data:
  valkey_dev_data:
