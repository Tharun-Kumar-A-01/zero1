[project]
name = "zero1-backend"
version = "0.1.0"
description = "Department Aptitude & Coding Practice Platform Backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
	"alembic>=1.20.0",
	"bleach>=6.4.0",
	"celery>=5.6.3",
	"flask>=3.1.3",
	"flask-jwt-extended>=4.7.4",
	"gunicorn>=26.2.0",
	"httpx>=0.28.1",
	"openpyxl>=3.1.5",
	"pandas>=3.0.6",
	"psycopg2-binary>=2.9.13",
	"pydantic>=2.13.5",
	"python-dotenv>=1.2.3",
	"redis>=8.1.0",
	"requests>=2.34.2",
	"sqlalchemy>=2.1.1",
	"uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
	"mypy>=2.3.1",
	"pytest>=9.1.1",
	"pytest-cov>=7.1.0",
	"pytest-mock>=3.16.0",
	"ruff>=0.16.9",
	"types-bleach>=6.4.0.20260728",
	"types-openpyxl>=3.1.5.20260827",
	"types-requests>=2.33.0.20260906",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

