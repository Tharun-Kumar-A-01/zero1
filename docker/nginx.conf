events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Edge rate limiting zones based on client IP
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=15r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=3r/s;
    limit_req_zone $binary_remote_addr zone=api_submit:10m rate=2r/s;
    limit_req_status 429;

    sendfile on;
    keepalive_timeout 65;

    # Upstream to backend
    upstream backend_api {
        server backend:5000;
    }

    server {
        listen 80;
        server_name localhost;

        # Standard 429 JSON response
        error_page 429 /429.json;
        location = /429.json {
            default_type application/json;
            return 429 '{"success": false, "error": {"code": "EDGE_RATE_LIMIT_EXCEEDED", "message": "Too many requests. Please slow down."}}';
        }

        # Auth endpoints rate-limiting
        location /api/auth/ {
            limit_req zone=api_auth burst=5 nodelay;
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Code submission rate-limiting
        location ~ ^/api/student/daily/(code-submit|mcq-submit) {
            limit_req zone=api_submit burst=3 nodelay;
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # General API proxy
        location /api/ {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static Frontend SPA
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
